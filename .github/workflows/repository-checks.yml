name: Repository checks
on: [push, pull_request]
jobs:
  new-files:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Reject archives, model files and anything over 1 MiB
        shell: bash
        run: |
          # Compare against the PR base, or the previous commit of the branch. A new branch
          # has no "before" commit (all zeros), so fall back to the merge base with main
          # rather than the root commit; historical media that predates this check is not
          # a new file.
          base="${{ github.event.pull_request.base.sha || github.event.before }}"
          if [ -z "$base" ] || [ "$base" = "0000000000000000000000000000000000000000" ] || ! git cat-file -e "$base^{commit}" 2>/dev/null; then
            git fetch --no-tags --quiet origin main
            base=$(git merge-base origin/main HEAD)
          fi
          echo "Comparing new files against $base"
          bad=0
          while IFS= read -r f; do
            [ -f "$f" ] || continue
            case "${f,,}" in
              *.zip|*.tar|*.gz|*.7z|*.exr|*.dpx|*.mkv|*.safetensors|*.ckpt|*.npy|*.npz)
                echo "New archive, raw scan or model file: $f"; bad=1;;
            esac
            size=$(stat -c %s "$f")
            limit=1048576
            case "$f" in docs/media/*.mp4) limit=8388608;; esac   # web comparison videos: 8 MiB
            if [ "$size" -gt "$limit" ]; then echo "File over the limit: $f ($size bytes); attach it to the examples release and link it instead"; bad=1; fi
          done < <(git diff --name-only --diff-filter=A "$base" HEAD)
          exit $bad
      - name: Internal links and assets
        shell: bash
        run: |
          python3 -m pip install --quiet pyyaml
          python3 tools/site-check/audit_links.py . --strict
