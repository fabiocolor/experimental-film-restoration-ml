name: Repository checks
on: [push, pull_request]
jobs:
  new-files:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Reject new media, archives and large files
        shell: bash
        run: |
          base="${{ github.event.pull_request.base.sha || github.event.before }}"
          if [ -z "$base" ] || ! git cat-file -e "$base^{commit}" 2>/dev/null; then base=$(git rev-list --max-parents=0 HEAD | tail -1); fi
          bad=0
          while IFS= read -r f; do
            [ -f "$f" ] || continue
            case "${f,,}" in
              *.png|*.jpg|*.jpeg|*.gif|*.webp|*.tif|*.tiff|*.exr|*.dpx|*.mp4|*.mov|*.mkv|*.zip|*.tar|*.gz|*.7z|*.safetensors|*.ckpt|*.npy|*.npz)
                echo "New media or archive file: $f"; bad=1;;
            esac
            size=$(stat -c %s "$f")
            if [ "$size" -gt 1048576 ]; then echo "File over 1 MiB: $f ($size bytes)"; bad=1; fi
          done < <(git diff --name-only --diff-filter=A "$base" HEAD)
          exit $bad
