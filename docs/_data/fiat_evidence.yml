# Evidence for the FIAT/IFTA companion pages, shown view-only.
# Images are served as Deep Zoom tile pyramids (<id>.dzi + <id>_files/) and videos as HLS streams (<id>_stream/index.m3u8)
# from the view host below. No original files are published or linked. Items are referred to by opaque ids.
view_base: https://fiat-ifta-2026-evidence.pages.dev/
ui:
  en:
    summary: 'All the evidence for this example: N items, in order'
    video: video
    seconds: s
    close: Close
    fit: Fit to screen
    actual: Actual size (1:1)
    zoom_in: Zoom in
    zoom_out: Zoom out
    hint: Pinch or scroll to zoom, drag to move. Viewing only.
    nojs: The full-size viewer needs JavaScript.
  pt-br:
    summary: 'Todas as evidências deste exemplo: N itens, em ordem'
    video: vídeo
    seconds: s
    close: Fechar
    fit: Ajustar à tela
    actual: Tamanho real (1:1)
    zoom_in: Aproximar
    zoom_out: Afastar
    hint: Use dois dedos ou a roda do mouse para dar zoom e arraste para mover. Apenas para visualização.
    nojs: O visualizador em tamanho real precisa de JavaScript.
  es:
    summary: 'Toda la evidencia de este ejemplo: N elementos, en orden'
    video: video
    seconds: s
    close: Cerrar
    fit: Ajustar a la pantalla
    actual: Tamaño real (1:1)
    zoom_in: Acercar
    zoom_out: Alejar
    hint: Usa dos dedos o la rueda del ratón para hacer zoom y arrastra para moverte. Solo para ver.
    nojs: El visor a tamaño completo necesita JavaScript.
examples:
  slide03:
  - id: s03-02
    kind: image
    label:
      en: Red Difference in Phoenix
      pt-br: Red Difference no Phoenix
      es: Red Difference en Phoenix
    caption:
      en: 'The Phoenix console in Red Difference view: the picture in grey, and red where the output differs from the frame without Dry Clean.'
      pt-br: 'O console do Phoenix no modo Red Difference: a imagem em cinza e, em vermelho, onde o resultado difere do quadro sem Dry Clean.'
      es: 'La consola de Phoenix en la vista Red Difference: la imagen en gris y, en rojo, donde la salida difiere del fotograma sin Dry Clean.'
    width: 1920
    height: 1080
  - id: s03-03
    kind: image
    label:
      en: The slide 3 image
      pt-br: A imagem do slide 3
      es: La imagen de la diapositiva 3
    caption:
      en: 'The image on slide 3: the same console frame, cropped to the viewer and the Dry Clean tools.'
      pt-br: 'A imagem do slide 3: o mesmo quadro do console, recortado no visualizador e nas ferramentas do Dry Clean.'
      es: 'La imagen de la diapositiva 3: el mismo fotograma de la consola, recortado al visor y a las herramientas de Dry Clean.'
    width: 1410
    height: 990
  slide04:
  - id: s04-01
    kind: image
    label:
      en: One source tile
      pt-br: Um bloco da fonte
      es: Un mosaico de la fuente
    caption:
      en: One of the four overlapping tiles cut from the faded frame. Each tile was padded to 1328 × 800 for Qwen Image Edit.
      pt-br: Um dos quatro blocos que se sobrepõem, cortados do quadro desbotado. Cada bloco foi completado até 1328 × 800 para o Qwen Image Edit.
      es: Uno de los cuatro mosaicos que se superponen, cortados del fotograma desvanecido. Cada mosaico se completó hasta 1328 × 800 para Qwen Image Edit.
    width: 1328
    height: 800
  - id: s04-02
    kind: image
    label:
      en: Edge map of a tile
      pt-br: Mapa de bordas de um bloco
      es: Mapa de bordes de un mosaico
    caption:
      en: The Canny edge map of the tile with the lifeguard tower. It was given to the model as shape control, so the colour stays on the film's own edges.
      pt-br: O mapa de bordas Canny do bloco com a torre do salva-vidas. Ele foi dado ao modelo como controle de forma, para que a cor fique presa às bordas do próprio filme.
      es: El mapa de bordes Canny del mosaico con la torre del salvavidas. Se le dio al modelo como control de forma, para que el color se quede en los bordes de la propia película.
    width: 1328
    height: 800
  - id: s04-03
    kind: image
    label:
      en: Colour reference
      pt-br: Referência de cor
      es: Referencia de color
    caption:
      en: The softly blurred colour chart used as the colour reference for every tile and for the whole-frame pass.
      pt-br: A carta de cores levemente desfocada usada como referência de cor em cada bloco e na passada do quadro inteiro.
      es: La carta de color ligeramente desenfocada usada como referencia de color en cada mosaico y en la pasada del fotograma completo.
    width: 333
    height: 238
  - id: s04-04
    kind: image
    label:
      en: Review sheet
      pt-br: Folha de revisão
      es: Hoja de revisión
    caption:
      en: 'From the same run: the faded source, the whole-frame output, the whole-frame colour on the scan''s brightness, and the four tiles'' colour stitched on the scan''s brightness.'
      pt-br: 'Da mesma execução: a fonte desbotada, o resultado do quadro inteiro, a cor do quadro inteiro sobre o brilho da digitalização e a cor dos quatro blocos unida sobre o brilho da digitalização.'
      es: 'De la misma ejecución: la fuente desvanecida, el resultado del fotograma completo, el color del fotograma completo sobre el brillo del escaneo y el color de los cuatro mosaicos unido sobre el brillo del escaneo.'
    width: 2080
    height: 431
  - id: s04-05
    kind: image
    label:
      en: Tiles on the scan's brightness
      pt-br: Blocos sobre o brilho da digitalização
      es: Mosaicos sobre el brillo del escaneo
    caption:
      en: The four tiles' colour stitched back over the original 2048 × 1556 brightness of the scan. The colour difference between tiles shows on the bikini and the sand.
      pt-br: A cor dos quatro blocos unida de volta sobre o brilho original da digitalização, em 2048 × 1556. A diferença de cor entre os blocos aparece no biquíni e na areia.
      es: El color de los cuatro mosaicos unido de nuevo sobre el brillo original del escaneo, a 2048 × 1556. La diferencia de color entre mosaicos se ve en el bikini y en la arena.
    width: 2048
    height: 1556
  - id: s04-06
    kind: image
    label:
      en: The slide 4 image
      pt-br: A imagem do slide 4
      es: La imagen de la diapositiva 4
    caption:
      en: 'The image on slide 4: the whole frame in one pass against four tiles stitched, with the lifeguard tower enlarged below each.'
      pt-br: 'A imagem do slide 4: o quadro inteiro em uma única passada contra quatro blocos unidos, com a torre do salva-vidas ampliada embaixo de cada um.'
      es: 'La imagen de la diapositiva 4: el fotograma completo en una sola pasada frente a cuatro mosaicos unidos, con la torre del salvavidas ampliada debajo de cada uno.'
    width: 1800
    height: 1441
  slide05:
  - id: s05-01
    kind: image
    label:
      en: Faded 16mm scan
      pt-br: Digitalização desbotada em 16mm
      es: Escaneo de 16mm desvanecido
    caption:
      en: A frame of the opening from the 16mm scan of the faded print, before any correction. It has a strong magenta cast, and most of the flicker is in the red channel.
      pt-br: Um quadro da abertura, da digitalização em 16mm da cópia desbotada, antes de qualquer correção. Tem uma forte dominante magenta, e a maior parte da cintilação está no canal vermelho.
      es: Un fotograma de la apertura, del escaneo de 16mm de la copia desvanecida, antes de cualquier corrección. Tiene una fuerte dominante magenta, y la mayor parte del parpadeo está en el canal rojo.
    width: 2200
    height: 1650
  - id: s05-02
    kind: image
    label:
      en: Cleaned and rebalanced scan
      pt-br: Digitalização limpa e reequilibrada
      es: Escaneo limpio y reequilibrado
    caption:
      en: 'The same frame after clean-up and rebalancing in Phoenix and Loki: the frames CopyCat was trained on.'
      pt-br: 'O mesmo quadro depois da limpeza e do reequilíbrio no Phoenix e no Loki: os quadros usados no treinamento do CopyCat.'
      es: 'El mismo fotograma después de la limpieza y el reequilibrio en Phoenix y Loki: los fotogramas con los que se entrenó CopyCat.'
    width: 4400
    height: 3300
  - id: s05-03
    kind: image
    label:
      en: The Nuke script
      pt-br: O script do Nuke
      es: El script de Nuke
    caption:
      en: 'The Nuke script for one Candy Candy shot: the shot in the viewer and the CopyCat graph. The scan frames are the input; the target keeps the scan''s brightness and takes the DVD''s colour.'
      pt-br: 'O script do Nuke de um plano de Candy Candy: o plano no visualizador e o grafo do CopyCat. Os quadros da digitalização são a entrada; o alvo mantém o brilho da digitalização e usa a cor do DVD.'
      es: 'El script de Nuke de un plano de Candy Candy: el plano en el visor y el grafo de CopyCat. Los fotogramas del escaneo son la entrada; el objetivo conserva el brillo del escaneo y toma el color del DVD.'
    width: 1951
    height: 1098
  - id: s05-04
    kind: image
    label:
      en: Training steps
      pt-br: Etapas de treinamento
      es: Pasos de entrenamiento
    caption:
      en: The 16mm source plus the PAL DVD gives the target. Below, the model's result after 1, 1,000, 30,000 and 60,000 training steps.
      pt-br: A fonte 16mm mais o PAL DVD dão o alvo. Abaixo, o resultado do modelo depois de 1, 1.000, 30.000 e 60.000 etapas de treinamento.
      es: La fuente de 16mm más el PAL DVD da el objetivo. Abajo, el resultado del modelo tras 1, 1.000, 30.000 y 60.000 pasos de entrenamiento.
    width: 1920
    height: 886
  - id: s05-06
    kind: image
    label:
      en: Training sheet
      pt-br: Folha de treinamento
      es: Hoja de entrenamiento
    caption:
      en: 'A CopyCat training sheet from a Candy Candy run on the opening: the faded scan, the target and the model''s output, which comes close to the target.'
      pt-br: 'Uma folha de treinamento do CopyCat de uma execução de Candy Candy na abertura: a digitalização desbotada, o alvo e o resultado do modelo, que chega perto do alvo.'
      es: 'Una hoja de entrenamiento de CopyCat de una ejecución de Candy Candy sobre la apertura: el escaneo desvanecido, el objetivo y el resultado del modelo, que se acerca al objetivo.'
    width: 1536
    height: 1536
  - id: s05-07
    kind: image
    label:
      en: Recovered frame
      pt-br: Quadro recuperado
      es: Fotograma recuperado
    caption:
      en: 'A frame of the result at full size: the DVD''s colour on the detail and grain of the 16mm scan.'
      pt-br: 'Um quadro do resultado em tamanho real: a cor do DVD sobre o detalhe e o grão da digitalização 16mm.'
      es: 'Un fotograma del resultado a tamaño completo: el color del DVD sobre el detalle y el grano del escaneo de 16mm.'
    width: 2742
    height: 2112
  slide07:
  - id: s07-01
    kind: image
    label:
      en: Leader lady copied in
      pt-br: Leader lady copiada
      es: Leader lady copiada
    caption:
      en: 'An early result guided by a leader lady: the model copied the woman from the reference into the frame, not only the colour.'
      pt-br: 'Um resultado inicial guiado por uma leader lady: o modelo copiou a mulher da referência para dentro do quadro, e não só a cor.'
      es: 'Un resultado temprano guiado por una leader lady: el modelo copió a la mujer de la referencia dentro del fotograma, no solo el color.'
    width: 1168
    height: 888
  - id: s07-02
    kind: image
    label:
      en: Softly blurred colour chart
      pt-br: Carta de cores levemente desfocada
      es: Carta de color ligeramente desenfocada
    caption:
      en: The reference that replaced the leader lady, used in every round of the prompt contest.
      pt-br: A referência que substituiu a leader lady, usada em todas as rodadas do concurso de prompts.
      es: La referencia que reemplazó a la leader lady, usada en todas las rondas del concurso de prompts.
    width: 333
    height: 238
  - id: s07-03
    kind: image
    label:
      en: Round 4 test frames
      pt-br: Quadros de teste da rodada 4
      es: Fotogramas de prueba de la ronda 4
    caption:
      en: The ten frames of Counter Attack chosen for round 4 of the contest. A prompt survived a round only if eight of the ten were acceptable.
      pt-br: Os dez quadros de Counter Attack escolhidos para a rodada 4 do concurso. Um prompt só passava de uma rodada se oito dos dez fossem aceitáveis.
      es: Los diez fotogramas de Counter Attack elegidos para la ronda 4 del concurso. Un prompt solo pasaba una ronda si ocho de los diez eran aceptables.
    width: 1800
    height: 608
  - id: s07-04
    kind: image
    label:
      en: 'Round 4: the three finalists'
      pt-br: 'Rodada 4: os três finalistas'
      es: 'Ronda 4: los tres finalistas'
    caption:
      en: 'One test frame: the faded source and the raw results of Iris, Celeste and Clara. In this round Celeste scored 10 of 10, and Iris and Clara 9 of 10; Clara won overall.'
      pt-br: 'Um quadro de teste: a fonte desbotada e os resultados brutos de Iris, Celeste e Clara. Nesta rodada, Celeste fez 10 de 10, e Iris e Clara 9 de 10; Clara venceu no geral.'
      es: 'Un fotograma de prueba: la fuente desvanecida y los resultados en bruto de Iris, Celeste y Clara. En esta ronda, Celeste sacó 10 de 10, e Iris y Clara 9 de 10; Clara ganó en el total.'
    width: 1414
    height: 348
  - id: s07-05
    kind: image
    label:
      en: The slide 7 image
      pt-br: A imagem do slide 7
      es: La imagen de la diapositiva 7
    caption:
      en: 'The image on slide 7: leader lady against colour chart on the top row, and the contest finalists on Counter Attack on the bottom row.'
      pt-br: 'A imagem do slide 7: leader lady contra carta de cores na fileira de cima, e os finalistas do concurso em Counter Attack na fileira de baixo.'
      es: 'La imagen de la diapositiva 7: leader lady frente a carta de color en la fila superior, y los finalistas del concurso en Counter Attack en la fila inferior.'
    width: 1600
    height: 909
  slide08:
  - id: s08-01
    kind: image
    label:
      en: Faded source
      pt-br: Fonte desbotada
      es: Fuente desvanecida
    caption:
      en: A frame of the Obsession dance scene after white balance and deflicker, still faded. The test covered 203 frames.
      pt-br: Um quadro da cena de dança de Obsession depois do balanço de branco e da redução de cintilação, ainda desbotado. O teste cobriu 203 quadros.
      es: Un fotograma de la escena de baile de Obsession después del balance de blancos y la reducción de parpadeo, todavía desvanecido. La prueba cubrió 203 fotogramas.
    width: 2048
    height: 1556
  - id: s08-02
    kind: image
    label:
      en: Edge map
      pt-br: Mapa de bordas
      es: Mapa de bordes
    caption:
      en: The Canny edge map of the same frame, used as shape control so the colour boundaries stay on the source.
      pt-br: O mapa de bordas Canny do mesmo quadro, usado como controle de forma para que os limites da cor fiquem na fonte.
      es: El mapa de bordes Canny del mismo fotograma, usado como control de forma para que los límites del color se queden en la fuente.
    width: 2048
    height: 1556
  - id: s08-03
    kind: image
    label:
      en: Colour reference
      pt-br: Referência de cor
      es: Referencia de color
    caption:
      en: The same softly blurred colour chart was the colour reference for every frame.
      pt-br: A mesma carta de cores levemente desfocada foi a referência de cor de cada quadro.
      es: La misma carta de color ligeramente desenfocada fue la referencia de color de cada fotograma.
    width: 333
    height: 238
  - id: s08-04
    kind: image
    label:
      en: One frame, recovered on its own
      pt-br: Um quadro, recuperado sozinho
      es: Un fotograma, recuperado solo
    caption:
      en: The same frame after Qwen Image Edit ran on it alone; only its colour was kept, on the original brightness.
      pt-br: O mesmo quadro depois que o Qwen Image Edit rodou só nele; apenas a cor foi mantida, sobre o brilho original.
      es: El mismo fotograma después de que Qwen Image Edit se ejecutara solo sobre él; solo se conservó su color, sobre el brillo original.
    width: 2048
    height: 1556
  - id: s08-05
    kind: video
    label:
      en: All 203 frames
      pt-br: Os 203 quadros
      es: Los 203 fotogramas
    caption:
      en: Every frame recovered on its own, played at 12 frames per second. The colour changes from frame to frame, for example on the dress on the right and in the background.
      pt-br: Cada quadro recuperado sozinho, reproduzido a 12 quadros por segundo. A cor muda de um quadro para outro, por exemplo no vestido à direita e no fundo.
      es: Cada fotograma recuperado por separado, reproducido a 12 fotogramas por segundo. El color cambia de un fotograma a otro, por ejemplo en el vestido de la derecha y en el fondo.
    width: 1024
    height: 778
    seconds: 17
  slide09:
  - id: s09-01
    kind: image
    label:
      en: Faded source
      pt-br: Fonte desbotada
      es: Fuente desvanecida
    caption:
      en: 'A frame of the crowd shot as it survives on the faded film copy: 338 frames at 1920 × 1440.'
      pt-br: 'Um quadro do plano da multidão como sobrevive na cópia desbotada: 338 quadros em 1920 × 1440.'
      es: 'Un fotograma del plano de la multitud tal como sobrevive en la copia de película desvanecida: 338 fotogramas a 1920 × 1440.'
    width: 1920
    height: 1440
  - id: s09-02
    kind: image
    label:
      en: Approved reference
      pt-br: Referência aprovada
      es: Referencia aprobada
    caption:
      en: 'The one approved reference: a Qwen Image Edit recovery of one frame of the shot. TeleStyle received it, together with each faded frame, for every frame of the shot.'
      pt-br: 'A única referência aprovada: uma recuperação de um quadro do plano feita com o Qwen Image Edit. O TeleStyle a recebeu, junto com cada quadro desbotado, para todos os quadros do plano.'
      es: 'La única referencia aprobada: una recuperación con Qwen Image Edit de un fotograma del plano. TeleStyle la recibió, junto con cada fotograma desvanecido, para cada fotograma del plano.'
    width: 1184
    height: 880
  - id: s09-03
    kind: image
    label:
      en: 'First test: colour drift'
      pt-br: 'Primeiro teste: deriva de cor'
      es: 'Primera prueba: deriva de color'
    caption:
      en: A three-frame test before the full run. With the first prompt, the man's shirt drifted to brown and a garment in the foreground stayed neutral instead of the approved cyan, so this version wasn't used.
      pt-br: Um teste de três quadros antes da execução completa. Com o primeiro prompt, a camisa do homem derivou para o marrom e uma peça de roupa em primeiro plano ficou neutra em vez do ciano aprovado, então esta versão não foi usada.
      es: Una prueba de tres fotogramas antes de la ejecución completa. Con el primer prompt, la camisa del hombre derivó hacia el marrón y una prenda en primer término quedó neutra en lugar del cian aprobado, así que esta versión no se usó.
    width: 1184
    height: 880
  - id: s09-04
    kind: image
    label:
      en: 'Second test: approved'
      pt-br: 'Segundo teste: aprovado'
      es: 'Segunda prueba: aprobada'
    caption:
      en: The same frame after the prompt was changed to keep the source's shapes and take the palette only from the reference. The pose stayed the source's and the colours matched the reference. This test was approved.
      pt-br: O mesmo quadro depois que o prompt foi alterado para manter as formas da fonte e tirar apenas a paleta da referência. A pose continuou a da fonte e as cores corresponderam à referência. Este teste foi aprovado.
      es: El mismo fotograma después de cambiar el prompt para conservar las formas de la fuente y tomar solo la paleta de la referencia. La pose siguió siendo la de la fuente y los colores coincidieron con la referencia. Esta prueba fue aprobada.
    width: 1184
    height: 880
  - id: s09-05
    kind: image
    label:
      en: One TeleStyle frame
      pt-br: Um quadro do TeleStyle
      es: Un fotograma de TeleStyle
    caption:
      en: 'One of the 338 TeleStyle outputs, straight from the model at 1184 × 880. Same prompt, reference and settings on every frame: 4 steps, CFG 1.0, seed 0.'
      pt-br: 'Uma das 338 saídas do TeleStyle, direto do modelo em 1184 × 880. Mesmo prompt, referência e configurações em todos os quadros: 4 etapas, CFG 1.0, seed 0.'
      es: 'Una de las 338 salidas de TeleStyle, directa del modelo a 1184 × 880. El mismo prompt, la misma referencia y los mismos ajustes en cada fotograma: 4 pasos, CFG 1,0, semilla 0.'
    width: 1184
    height: 880
  - id: s09-06
    kind: image
    label:
      en: Another TeleStyle frame
      pt-br: Outro quadro do TeleStyle
      es: Otro fotograma de TeleStyle
    caption:
      en: Another frame, generated on its own with the same recipe. Each frame took about 32 seconds once the machine was warm; the whole shot took about 13,560 seconds.
      pt-br: Outro quadro, gerado isoladamente com a mesma receita. Cada quadro levou cerca de 32 segundos depois que a máquina estava aquecida; o plano inteiro levou cerca de 13.560 segundos.
      es: Otro fotograma, generado por separado con la misma receta. Cada fotograma tomó unos 32 segundos una vez calentada la máquina; el plano completo tomó unos 13.560 segundos.
    width: 1184
    height: 880
  - id: s09-07
    kind: image
    label:
      en: Colour on the scan's brightness
      pt-br: Cor sobre o brilho da digitalização
      es: Color sobre el brillo del escaneo
    caption:
      en: 'The same frame after compositing: the untouched 1920 × 1440 brightness of the scan, with TeleStyle''s colour enlarged from 1184 × 880. Only the colour comes from TeleStyle.'
      pt-br: 'O mesmo quadro depois da composição: o brilho intacto da digitalização em 1920 × 1440, com a cor do TeleStyle ampliada de 1184 × 880. Só a cor vem do TeleStyle.'
      es: 'El mismo fotograma después de la composición: el brillo del escaneo a 1920 × 1440, intacto, con el color de TeleStyle ampliado desde 1184 × 880. Solo el color viene de TeleStyle.'
    width: 1920
    height: 1440
  - id: s09-08
    kind: image
    label:
      en: TeleStyle against the adapter
      pt-br: TeleStyle contra o adaptador
      es: TeleStyle frente al adaptador
    caption:
      en: Source, an early version of the Temporal CbCr adapter, and TeleStyle, at 12 points across the shot. The adapter was steadier by the numbers but showed cyan patches on faces and red or orange blotches, so TeleStyle was chosen.
      pt-br: Fonte, uma versão inicial do adaptador Temporal CbCr e o TeleStyle, em 12 pontos ao longo do plano. Pelos números, o adaptador era mais estável, mas mostrava manchas ciano nos rostos e manchas vermelhas ou laranja, então o TeleStyle foi escolhido.
      es: La fuente, una versión temprana del adaptador Temporal CbCr y TeleStyle, en 12 puntos a lo largo del plano. Según las cifras, el adaptador era más estable, pero mostraba zonas cian en las caras y manchas rojas o naranjas, así que se eligió TeleStyle.
    width: 1920
    height: 5760
  - id: s09-09
    kind: image
    label:
      en: Final comparison
      pt-br: Comparação final
      es: Comparación final
    caption:
      en: 'A still of the comparison shown in the talk: original scan, approved colour reference and chroma recovery.'
      pt-br: 'Um quadro da comparação mostrada na palestra: digitalização original, referência de cor aprovada e recuperação de croma.'
      es: 'Una imagen fija de la comparación mostrada en la charla: escaneo original, referencia de color aprobada y recuperación de croma.'
    width: 1920
    height: 1080
  slide11:
  - id: s11-01
    kind: image
    label:
      en: Cadence check
      pt-br: Verificação de cadência
      es: Verificación de cadencia
    caption:
      en: The brightness of the first 16 of the shot's 385 frames. The check found 77 near-duplicate frames, so the 308 distinct frames were prepared at 24 frames per second for H3.
      pt-br: O brilho dos primeiros 16 dos 385 quadros do plano. A verificação encontrou 77 quadros quase duplicados, então os 308 quadros distintos foram preparados a 24 quadros por segundo para o H3.
      es: El brillo de los primeros 16 de los 385 fotogramas del plano. La verificación encontró 77 fotogramas casi duplicados, así que los 308 fotogramas distintos se prepararon a 24 fotogramas por segundo para H3.
    width: 1920
    height: 1552
  - id: s11-02
    kind: image
    label:
      en: Approved main palette
      pt-br: Paleta principal aprovada
      es: Paleta principal aprobada
