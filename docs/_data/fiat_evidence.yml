# Evidence for the FIAT/IFTA companion pages, shown view-only.
# Images are served as Deep Zoom tile pyramids (<id>.dzi + <id>_files/) and videos as HLS streams (<id>_stream/index.m3u8)
# from the view host below. No original files are published or linked. Items are referred to by opaque ids.
view_base: https://fiat-ifta-2026-evidence.pages.dev/
ui:
  en:
    summary: 'All the evidence for this example: N items, in order'
    video: video
    seconds: s
    close: Close
    fit: Fit to screen
    actual: Actual size (1:1)
    zoom_in: Zoom in
    zoom_out: Zoom out
    hint: Pinch or scroll to zoom, drag to move. Viewing only.
    nojs: The full-size viewer needs JavaScript.
  pt-br:
    summary: 'Todas as evidências deste exemplo: N itens, em ordem'
    video: vídeo
    seconds: s
    close: Fechar
    fit: Ajustar à tela
    actual: Tamanho real (1:1)
    zoom_in: Aproximar
    zoom_out: Afastar
    hint: Use dois dedos ou a roda do mouse para dar zoom e arraste para mover. Apenas para visualização.
    nojs: O visualizador em tamanho real precisa de JavaScript.
  es:
    summary: 'Toda la evidencia de este ejemplo: N elementos, en orden'
    video: video
    seconds: s
    close: Cerrar
    fit: Ajustar a la pantalla
    actual: Tamaño real (1:1)
    zoom_in: Acercar
    zoom_out: Alejar
    hint: Usa dos dedos o la rueda del ratón para hacer zoom y arrastra para moverte. Solo para ver.
    nojs: El visor a tamaño completo necesita JavaScript.
examples:
  slide03:
  - id: s03-01
    kind: image
    label:
      en: Without and with Dry Clean
      pt-br: Sem e com Dry Clean
      es: Sin y con Dry Clean
    caption:
      en: 'One frame of the Point Blank shot, exported from Phoenix at full 2048 × 1556: without Dry Clean, with Dry Clean, and a later model test (right), side by side.'
      pt-br: 'Um quadro do plano de Point Blank, exportado do Phoenix em 2048 × 1556 completos: sem Dry Clean, com Dry Clean e um teste posterior do modelo (à direita), lado a lado.'
      es: 'Un fotograma del plano de Point Blank, exportado desde Phoenix a 2048 × 1556 completo: sin Dry Clean, con Dry Clean y una prueba posterior del modelo (derecha), lado a lado.'
    width: 1536
    height: 419
  - id: s03-02
    kind: image
    label:
      en: Red Difference in Phoenix
      pt-br: Red Difference no Phoenix
      es: Red Difference en Phoenix
    caption:
      en: 'The Phoenix console in Red Difference view: the picture in grey, and red where the output differs from the frame without Dry Clean. In this capture the output already includes the 8 recovery strokes of a later test, so the red is almost, but not exactly, Dry Clean on its own.'
      pt-br: 'O console do Phoenix no modo Red Difference: a imagem em cinza e, em vermelho, onde o resultado difere do quadro sem Dry Clean. Nesta captura, o resultado já inclui as 8 pinceladas de recuperação de um teste posterior, então o vermelho é quase, mas não exatamente, só o Dry Clean.'
      es: 'La consola de Phoenix en la vista Red Difference: la imagen en gris y, en rojo, donde la salida difiere del fotograma sin Dry Clean. En esta captura la salida ya incluye los 8 trazos de recuperación de una prueba posterior, así que el rojo es casi, pero no exactamente, Dry Clean por sí solo.'
    width: 1920
    height: 1080
  - id: s03-03
    kind: image
    label:
      en: The slide 3 image
      pt-br: A imagem do slide 3
      es: La imagen de la diapositiva 3
    caption:
      en: 'The image on slide 3: the same console frame, cropped to the viewer and the Dry Clean tools.'
      pt-br: 'A imagem do slide 3: o mesmo quadro do console, recortado no visualizador e nas ferramentas do Dry Clean.'
      es: 'La imagen de la diapositiva 3: el mismo fotograma de la consola, recortado al visor y a las herramientas de Dry Clean.'
    width: 1410
    height: 990
  slide04:
  - id: s04-01
    kind: image
    label:
      en: One source tile
      pt-br: Um bloco da fonte
      es: Un mosaico de la fuente
    caption:
      en: One of the four overlapping tiles cut from the faded frame. Each tile was padded to 1328 × 800 for Qwen Image Edit.
      pt-br: Um dos quatro blocos que se sobrepõem, cortados do quadro desbotado. Cada bloco foi completado até 1328 × 800 para o Qwen Image Edit.
      es: Uno de los cuatro mosaicos que se superponen, cortados del fotograma desvanecido. Cada mosaico se completó hasta 1328 × 800 para Qwen Image Edit.
    width: 1328
    height: 800
  - id: s04-02
    kind: image
    label:
      en: Edge map of a tile
      pt-br: Mapa de bordas de um bloco
      es: Mapa de bordes de un mosaico
    caption:
      en: The Canny edge map of the tile with the lifeguard tower. It was given to the model as shape control, so the colour stays on the film's own edges.
      pt-br: O mapa de bordas Canny do bloco com a torre do salva-vidas. Ele foi dado ao modelo como controle de forma, para que a cor fique presa às bordas do próprio filme.
      es: El mapa de bordes Canny del mosaico con la torre del salvavidas. Se le dio al modelo como control de forma, para que el color se quede en los bordes de la propia película.
    width: 1328
    height: 800
  - id: s04-03
    kind: image
    label:
      en: Colour reference
      pt-br: Referência de cor
      es: Referencia de color
    caption:
      en: The softly blurred colour chart used as the colour reference for every tile and for the whole-frame pass.
      pt-br: A carta de cores levemente desfocada usada como referência de cor em cada bloco e na passada do quadro inteiro.
      es: La carta de color ligeramente desenfocada usada como referencia de color en cada mosaico y en la pasada del fotograma completo.
    width: 333
    height: 238
  - id: s04-04
    kind: image
    label:
      en: Review sheet
      pt-br: Folha de revisão
      es: Hoja de revisión
    caption:
      en: 'From the same run: the faded source, the whole-frame output, the whole-frame colour on the scan''s brightness, and the four tiles'' colour stitched on the scan''s brightness.'
      pt-br: 'Da mesma execução: a fonte desbotada, o resultado do quadro inteiro, a cor do quadro inteiro sobre o brilho da digitalização e a cor dos quatro blocos unida sobre o brilho da digitalização.'
      es: 'De la misma ejecución: la fuente desvanecida, el resultado del fotograma completo, el color del fotograma completo sobre el brillo del escaneo y el color de los cuatro mosaicos unido sobre el brillo del escaneo.'
    width: 2080
    height: 431
  - id: s04-05
    kind: image
    label:
      en: Tiles on the scan's brightness
      pt-br: Blocos sobre o brilho da digitalização
      es: Mosaicos sobre el brillo del escaneo
    caption:
      en: The four tiles' colour stitched back over the original 2048 × 1556 brightness of the scan. The colour difference between tiles shows on the bikini and the sand.
      pt-br: A cor dos quatro blocos unida de volta sobre o brilho original da digitalização, em 2048 × 1556. A diferença de cor entre os blocos aparece no biquíni e na areia.
      es: El color de los cuatro mosaicos unido de nuevo sobre el brillo original del escaneo, a 2048 × 1556. La diferencia de color entre mosaicos se ve en el bikini y en la arena.
    width: 2048
    height: 1556
  - id: s04-06
    kind: image
    label:
      en: The slide 4 image
      pt-br: A imagem do slide 4
      es: La imagen de la diapositiva 4
    caption:
      en: 'The image on slide 4: the whole frame in one pass against four tiles stitched, with the lifeguard tower enlarged below each.'
      pt-br: 'A imagem do slide 4: o quadro inteiro em uma única passada contra quatro blocos unidos, com a torre do salva-vidas ampliada embaixo de cada um.'
      es: 'La imagen de la diapositiva 4: el fotograma completo en una sola pasada frente a cuatro mosaicos unidos, con la torre del salvavidas ampliada debajo de cada uno.'
    width: 1800
    height: 1441
  slide07:
  - id: s07-02
    kind: image
    label:
      en: Softly blurred colour chart
      pt-br: Carta de cores levemente desfocada
      es: Carta de color ligeramente desenfocada
    caption:
      en: The reference that replaced the leader lady, used in every round of the prompt contest.
      pt-br: A referência que substituiu a leader lady, usada em todas as rodadas do concurso de prompts.
      es: La referencia que reemplazó a la leader lady, usada en todas las rondas del concurso de prompts.
    width: 333
    height: 238
  slide08:
  - id: s08-01
    kind: image
    label:
      en: Faded source
      pt-br: Fonte desbotada
      es: Fuente desvanecida
    caption:
      en: A frame of the Obsession dance scene after white balance and deflicker, still faded. The test covered 203 frames.
      pt-br: Um quadro da cena de dança de Obsession depois do balanço de branco e da redução de cintilação, ainda desbotado. O teste cobriu 203 quadros.
      es: Un fotograma de la escena de baile de Obsession después del balance de blancos y la reducción de parpadeo, todavía desvanecido. La prueba cubrió 203 fotogramas.
    width: 2048
    height: 1556
  - id: s08-02
    kind: image
    label:
      en: Edge map
      pt-br: Mapa de bordas
      es: Mapa de bordes
    caption:
      en: The Canny edge map of the same frame, used as shape control so the colour boundaries stay on the source.
      pt-br: O mapa de bordas Canny do mesmo quadro, usado como controle de forma para que os limites da cor fiquem na fonte.
      es: El mapa de bordes Canny del mismo fotograma, usado como control de forma para que los límites del color se queden en la fuente.
    width: 2048
    height: 1556
  - id: s08-03
    kind: image
    label:
      en: Colour reference
      pt-br: Referência de cor
      es: Referencia de color
    caption:
      en: The same softly blurred colour chart was the colour reference for every frame.
      pt-br: A mesma carta de cores levemente desfocada foi a referência de cor de cada quadro.
      es: La misma carta de color ligeramente desenfocada fue la referencia de color de cada fotograma.
    width: 333
    height: 238
  - id: s08-04
    kind: image
    label:
      en: One frame, recovered on its own
      pt-br: Um quadro, recuperado sozinho
      es: Un fotograma, recuperado solo
    caption:
      en: The same frame after Qwen Image Edit ran on it alone; only its colour was kept, on the original brightness.
      pt-br: O mesmo quadro depois que o Qwen Image Edit rodou só nele; apenas a cor foi mantida, sobre o brilho original.
      es: El mismo fotograma después de que Qwen Image Edit se ejecutara solo sobre él; solo se conservó su color, sobre el brillo original.
    width: 2048
    height: 1556
  - id: s08-05
    kind: video
    label:
      en: All 203 frames
      pt-br: Os 203 quadros
      es: Los 203 fotogramas
    caption:
      en: Every frame recovered on its own, played at 12 frames per second. The colour changes from frame to frame, for example on the dress on the right and in the background.
      pt-br: Cada quadro recuperado sozinho, reproduzido a 12 quadros por segundo. A cor muda de um quadro para outro, por exemplo no vestido à direita e no fundo.
      es: Cada fotograma recuperado por separado, reproducido a 12 fotogramas por segundo. El color cambia de un fotograma a otro, por ejemplo en el vestido de la derecha y en el fondo.
    width: 1024
    height: 778
    seconds: 17
  slide13:
  - id: s13-01
    kind: image
    label:
      en: Faded source
      pt-br: Fonte desbotada
      es: Fuente desvanecida
    caption:
      en: A frame of the 164-frame choir shot at 2048 × 1556. The colour has faded to magenta. This frame has no teacher.
      pt-br: Um quadro do plano do coro, de 164 quadros, em 2048 × 1556. A cor desbotou para o magenta. Este quadro não tem professor.
      es: Un fotograma del plano del coro, de 164 fotogramas, a 2048 × 1556. El color se ha desvanecido hacia el magenta. Este fotograma no tiene maestro.
    width: 2048
    height: 1556
  - id: s13-02
    kind: image
    label:
      en: 'Rejected: H3'
      pt-br: 'Rejeitado: H3'
      es: 'Rechazado: H3'
    caption:
      en: Faded frames above, and H3's colour on the source brightness below, at eight points across the shot. None of H3's 164 frames passed the alignment check, so none became a teacher. Note the misplaced blue and cyan patches.
      pt-br: Quadros desbotados acima e, abaixo, a cor do H3 sobre o brilho da fonte, em oito pontos ao longo do plano. Nenhum dos 164 quadros do H3 passou na verificação de alinhamento, então nenhum virou professor. Repare nas manchas azuis e ciano fora do lugar.
      es: Arriba, fotogramas desvanecidos; abajo, el color de H3 sobre el brillo de la fuente, en ocho puntos a lo largo del plano. Ninguno de los 164 fotogramas de H3 pasó la verificación de alineación, así que ninguno se convirtió en maestro. Observa las zonas azules y cian fuera de lugar.
    width: 1536
    height: 1152
  - id: s13-03
    kind: image
    label:
      en: Approved palette
      pt-br: Paleta aprovada
      es: Paleta aprobada
    caption:
      en: 'One synthetic colour reference for a single frame: Qwen Image Edit''s colour on the source brightness. Approved on 14 August 2026 as the palette for this shot only; it isn''t historical colour evidence.'
      pt-br: 'Uma referência de cor sintética para um único quadro: a cor do Qwen Image Edit sobre o brilho da fonte. Aprovada em 14 de agosto de 2026 como paleta apenas para este plano; não é evidência histórica de cor.'
      es: 'Una referencia de color sintética para un solo fotograma: el color de Qwen Image Edit sobre el brillo de la fuente. Aprobada el 14 de agosto de 2026 como paleta solo para este plano; no es evidencia histórica del color.'
    width: 2048
    height: 1556
  - id: s13-04
    kind: image
    label:
      en: Teacher, frame 35
      pt-br: Professor, quadro 35
      es: Maestro, fotograma 35
    caption:
      en: 'A TeleStyle teacher: TeleStyle''s colour on the untouched source brightness. It passed the alignment check; it is one of 101 teachers (82 for training, 19 for validation), none from H3.'
      pt-br: 'Um professor do TeleStyle: a cor do TeleStyle sobre o brilho intacto da fonte. Passou na verificação de alinhamento; é um de 101 professores (82 para treinamento, 19 para validação), nenhum do H3.'
      es: 'Un maestro de TeleStyle: el color de TeleStyle sobre el brillo intacto de la fuente. Pasó la verificación de alineación; es uno de 101 maestros (82 para entrenamiento, 19 para validación), ninguno de H3.'
    width: 2048
    height: 1556
  - id: s13-05
    kind: image
    label:
      en: Teacher, frame 80
      pt-br: Professor, quadro 80
      es: Maestro, fotograma 80
    caption:
      en: Another TeleStyle teacher. Teachers covered frames 30 to 41, 62 to 93 and 127 to 164 for training, and 94 to 112 for validation. Frames 1 to 29, 42 to 61 and 113 to 126 had none.
      pt-br: Outro professor do TeleStyle. Os professores cobriram os quadros 30 a 41, 62 a 93 e 127 a 164 para treinamento, e 94 a 112 para validação. Os quadros 1 a 29, 42 a 61 e 113 a 126 não tiveram nenhum.
      es: Otro maestro de TeleStyle. Los maestros cubrieron los fotogramas 30 a 41, 62 a 93 y 127 a 164 para entrenamiento, y 94 a 112 para validación. Los fotogramas 1 a 29, 42 a 61 y 113 a 126 no tuvieron ninguno.
    width: 2048
    height: 1556
  - id: s13-06
    kind: image
    label:
      en: The slide 12 grid
      pt-br: A grade do slide 12
      es: La cuadrícula de la diapositiva 12
    caption:
      en: Faded source, teacher and adapter result for four frames. The first and third have no teacher.
      pt-br: Fonte desbotada, professor e resultado do adaptador para quatro quadros. O primeiro e o terceiro não têm professor.
      es: Fuente desvanecida, maestro y resultado del adaptador para cuatro fotogramas. El primero y el tercero no tienen maestro.
    width: 1636
    height: 1756
  - id: s13-07
    kind: image
    label:
      en: Adapter, frame without a teacher
      pt-br: Adaptador, quadro sem professor
      es: Adaptador, fotograma sin maestro
    caption:
      en: The adapter's colour on the untouched brightness for a frame with no teacher. The adapter is a small model for this shot only (931,274 parameters), trained for 60 epochs in about 89 seconds.
      pt-br: A cor do adaptador sobre o brilho intacto em um quadro sem professor. O adaptador é um modelo pequeno, só para este plano (931.274 parâmetros), treinado por 60 épocas em cerca de 89 segundos.
      es: El color del adaptador sobre el brillo intacto, en un fotograma sin maestro. El adaptador es un modelo pequeño solo para este plano (931.274 parámetros), entrenado durante 60 épocas en unos 89 segundos.
    width: 2048
    height: 1556
  - id: s13-08
    kind: image
    label:
      en: Adapter, another frame without a teacher
      pt-br: Adaptador, outro quadro sem professor
      es: Adaptador, otro fotograma sin maestro
    caption:
      en: A frame from the 42 to 61 stretch, where there were no teachers at all.
      pt-br: Um quadro do trecho de 42 a 61, onde não havia nenhum professor.
      es: Un fotograma del tramo de 42 a 61, donde no había ningún maestro.
    width: 2048
    height: 1556
  - id: s13-09
    kind: image
    label:
      en: Final frame, full size
      pt-br: Quadro final, tamanho real
      es: Fotograma final, tamaño completo
    caption:
      en: 'A frame of the result at the full 2048 × 1556: the source brightness untouched, the colour from the adapter.'
      pt-br: 'Um quadro do resultado nos 2048 × 1556 completos: o brilho da fonte intacto, a cor vinda do adaptador.'
      es: 'Un fotograma del resultado a 2048 × 1556 completo: el brillo de la fuente intacto, el color del adaptador.'
    width: 2048
    height: 1556
  - id: s13-10
    kind: image
    label:
      en: Three routes compared
      pt-br: Três caminhos comparados
      es: Tres vías comparadas
    caption:
      en: 'Five frames, three ways: H3 alone, H3 with a few TeleStyle corrections, and the adapter trained on half of the shot. All three keep the source brightness.'
      pt-br: 'Cinco quadros, de três formas: só o H3, o H3 com algumas correções do TeleStyle e o adaptador treinado em metade do plano. Os três mantêm o brilho da fonte.'
      es: 'Cinco fotogramas, de tres maneras: H3 solo, H3 con algunas correcciones de TeleStyle y el adaptador entrenado con la mitad del plano. Las tres conservan el brillo de la fuente.'
    width: 960
    height: 1200
  slide21:
  - id: s21-01
    kind: video
    label:
      en: Three renders
      pt-br: Três renderizações
      es: Tres renderizados
    caption:
      en: 'The 52-frame shot exported from Phoenix three ways, side by side: without Dry Clean, with Dry Clean, and with the model''s recovery.'
      pt-br: 'O plano de 52 quadros exportado do Phoenix de três formas, lado a lado: sem Dry Clean, com Dry Clean e com a recuperação do modelo.'
      es: 'El plano de 52 fotogramas exportado desde Phoenix de tres maneras, lado a lado: sin Dry Clean, con Dry Clean y con la recuperación del modelo.'
    width: 2304
    height: 640
    seconds: 9
  - id: s21-02
    kind: image
    label:
      en: Difference and the model's picks
      pt-br: Diferença e escolhas do modelo
      es: Diferencia y elección del modelo
    caption:
      en: 'One frame: without Dry Clean, with Dry Clean, the difference in red, and in yellow the pixels the model chose to bring back. The lower rows enlarge the person, the ceiling and the right wall, where it also picked wall areas.'
      pt-br: 'Um quadro: sem Dry Clean, com Dry Clean, a diferença em vermelho e, em amarelo, os pixels que o modelo escolheu trazer de volta. As linhas de baixo ampliam a pessoa, o teto e a parede da direita, onde ele também escolheu áreas da parede.'
      es: 'Un fotograma: sin Dry Clean, con Dry Clean, la diferencia en rojo y, en amarillo, los píxeles que el modelo eligió recuperar. Las filas inferiores amplían la persona, el techo y la pared derecha, donde también eligió zonas de la pared.'
    width: 1536
    height: 1220
  - id: s21-03
    kind: image
    label:
      en: Strokes in the project
      pt-br: Pinceladas no projeto
      es: Trazos en el proyecto
    caption:
      en: 'Phoenix playing the shot with Matte Paint Select on: the white outlines are the model''s 630 brush strokes over 52 frames, drawn by Phoenix itself.'
      pt-br: 'O Phoenix reproduzindo o plano com o Matte Paint Select ativado: os contornos brancos são as 630 pinceladas do modelo em 52 quadros, desenhadas pelo próprio Phoenix.'
      es: 'Phoenix reproduciendo el plano con Matte Paint Select activado: los contornos blancos son los 630 trazos de pincel del modelo en 52 fotogramas, dibujados por el propio Phoenix.'
    width: 1920
    height: 1080
  - id: s21-04
    kind: image
    label:
      en: Red Difference with strokes
      pt-br: Red Difference com pinceladas
      es: Red Difference con trazos
    caption:
      en: The same result with Red Difference on (red is the change against the frame without Dry Clean) and the strokes shown. A frame of the slide 21 recording.
      pt-br: O mesmo resultado com o Red Difference ativado (o vermelho é a mudança em relação ao quadro sem Dry Clean) e as pinceladas visíveis. Um quadro da gravação do slide 21.
      es: El mismo resultado con Red Difference activado (el rojo es el cambio respecto al fotograma sin Dry Clean) y los trazos visibles. Un fotograma de la grabación de la diapositiva 21.
    width: 1920
    height: 1080
  - id: s21-05
    kind: image
    label:
      en: 'Rejected: sparser version'
      pt-br: 'Rejeitada: versão mais esparsa'
      es: 'Rechazada: versión más dispersa'
    caption:
      en: A later version added a motion check against neighbouring frames and kept only 8 strokes. It was rejected in favour of the broader 630-stroke version.
      pt-br: Uma versão posterior acrescentou uma verificação de movimento em relação aos quadros vizinhos e manteve apenas 8 pinceladas. Foi rejeitada em favor da versão mais ampla, de 630 pinceladas.
      es: Una versión posterior agregó una verificación de movimiento respecto a los fotogramas vecinos y conservó solo 8 trazos. Se rechazó en favor de la versión más amplia de 630 trazos.
