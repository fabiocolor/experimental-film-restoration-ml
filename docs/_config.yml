title: Machine Learning for Film Restoration
description: Open research on Qwen Image Edit, open-weight colour recovery, and reference-trained film restoration
remote_theme: just-the-docs/just-the-docs@v0.10.0

plugins:
  - jekyll-remote-theme

url: ""
baseurl: "/custom-machine-learning-for-film-restoration"

color_scheme: dark

aux_links:
  "GitHub":
    - "https://github.com/fabiocolor/custom-machine-learning-for-film-restoration"
  "Research Paper":
    - "https://library.imaging.org/archiving/articles/22/1/35"

nav_enabled: true
search_enabled: true
heading_anchors: true

back_to_top: true
back_to_top_text: "Back to top"

footer_content: "Independent research in machine learning for film preservation and restoration. <a href=\"/custom-machine-learning-for-film-restoration/credits/\">Credits &amp; attribution</a>."

permalink: pretty

defaults:
