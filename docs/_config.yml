title: Experimental Film Restoration with Machine Learning
description: "Source-first research on film restoration with machine learning: colour recovery, gap filling, dirt removal, and upscaling. What survives in the film is evidence; models only fill what was lost."
remote_theme: just-the-docs/just-the-docs@v0.10.0

plugins:
  - jekyll-remote-theme

url: ""
baseurl: "/custom-machine-learning-for-film-restoration"

color_scheme: dark

aux_links:
  "GitHub":
    - "https://github.com/fabiocolor/custom-machine-learning-for-film-restoration"
  "Research Paper":
    - "https://library.imaging.org/archiving/articles/22/1/35"

nav_enabled: true
search_enabled: true
heading_anchors: true

back_to_top: true
back_to_top_text: "Back to top"

footer_content: "<span class=\"footnote\">* Examples are research demos of the workflow, not production-quality exports.</span><br>Independent research in machine learning for film preservation and restoration. <a href=\"/custom-machine-learning-for-film-restoration/credits/\">Credits &amp; attribution</a>."

permalink: pretty

defaults:
  - scope:
      path: "downloads/qwen-color-recovery/THIRD_PARTY_NOTICES.md"
    values:
      nav_exclude: true

include:
  - __init__.py

exclude:
  - images_kebab/full/
  - film-element-pair-alignment-runbook.md
  - downloads/qwen-color-recovery/README.md
  - downloads/qwen-color-recovery/custom_nodes/faded_color_recovery/README.md
