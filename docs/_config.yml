title: Experimental Film Restoration with Machine Learning
description: "Research on film restoration with machine learning: faded colour recovery, Temporal CbCr, diffusion healing, diffusion full reconstruction, diffusion upscaling and black-and-white colourization. What survives in the film is evidence; models only fill what was lost."
remote_theme: just-the-docs/just-the-docs@v0.10.0

plugins:
  - jekyll-remote-theme
  - jekyll-redirect-from

url: "https://fabiocolor.github.io"
baseurl: "/experimental-film-restoration-ml"

color_scheme: monograph

aux_links:
  "GitHub":
    - "https://github.com/fabiocolor/experimental-film-restoration-ml"
  "Research Paper":
    - "https://library.imaging.org/archiving/articles/22/1/35"

nav_enabled: true
search_enabled: true
heading_anchors: true

back_to_top: true
back_to_top_text: "Back to top"

footer_content: "<span class=\"footnote\">* The examples on this site are workflow demonstrations, not finished restorations.</span><br>Independent research in machine learning for film preservation and restoration. <a href=\"/experimental-film-restoration-ml/credits/\">Credits &amp; attribution</a>."

permalink: pretty

include:
  - __init__.py

